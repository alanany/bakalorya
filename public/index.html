<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انطلق - منصة التعليم الإلكتروني</title>
  <meta name="description" content="منصة انطلق للتعليم الإلكتروني والجلسات التفاعلية المباشرة لطلاب الانطلق">
  <!-- Google Fonts: Latin + Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    #app-viewport {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    /* Arabic RTL font override */
    :lang(ar),
    [dir="rtl"] {
      font-family: 'Cairo', 'Outfit', sans-serif;
    }

    /* Logo: white background logo needs a white pill background in dark mode */
    #header-logo {
      background: #fff;
      border-radius: 14px;
      padding: 6px 18px;
      height: 90px !important;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    #header-logo:hover {
      transform: scale(1.12);
      box-shadow: 0 6px 26px rgba(0, 86, 210, 0.5);
    }

    .app-sidebar .sidebar-header img {
      background: #fff;
      border-radius: 14px;
      padding: 6px 16px;
      height: 80px !important;
    }

  </style>
</head>

<body class="light-theme">
  <!-- Side Menu Overlay & Sidebar Drawer -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="app-sidebar" id="app-sidebar">
    <div class="sidebar-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="assets/logo.png" alt="انطلق" style="height:52px; object-fit:contain;">
      </div>
      <button class="sidebar-close-btn" id="sidebar-close-btn">&times;</button>
    </div>
    <div class="sidebar-menu-list" id="sidebar-menu-list">
      <!-- Dynamic side menu navigation links -->
    </div>
  </aside>

  <!-- Main Header Navbar -->
  <header class="app-header">
    <div class="header-container">

      <!-- Brand Logo + Toggle + Teachers Link -->
      <div class="header-left-brand">
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="القائمة الجانبية">
          <i data-lucide="menu" style="width:20px; height:20px;"></i>
        </button>

        <!-- Entlq Logo Image -->
        <a href="#landing" class="logo-link">
          <img src="assets/logo.png" alt="انطلق" id="header-logo">
        </a>
      </div>

      <!-- Centered Pill Search Bar -->
      <div class="header-search-container">
        <div id="header-search-wrapper">
          <input type="text" id="header-search-input" placeholder="بحث...">
          <button id="header-search-btn" title="بحث">
            <i data-lucide="search" style="width:16px; height:16px;"></i>
          </button>
        </div>
      </div>

      <!-- Nav Menu (Injected for logged-in users) -->
      <nav class="nav-menu" id="nav-menu">
        <!-- Injected navigation -->
      </nav>

      <!-- Right Header Actions (Log In + Join for Free + Controls) -->
      <div class="header-actions">
        <button class="theme-toggle" id="lang-toggle" title="تبديل اللغة">
          EN
        </button>
        <button class="theme-toggle" id="theme-toggle" title="تبديل المظهر">
          <i data-lucide="sun" class="sun-icon"></i>
          <i data-lucide="moon" class="moon-icon"></i>
        </button>

        <div id="auth-action-container">
          <!-- Injected login/register action or user dropdown -->
        </div>
      </div>

    </div>
  </header>

  <!-- Viewport -->
  <main id="app-viewport">
    <div
      style="min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-color);">
      <div class="spinner" style="width: 44px; height: 44px; border-width: 4px; margin-bottom: 16px;"></div>
      <p style="font-size: 0.95rem; font-weight: 700; opacity: 0.8;">جاري تحميل منصة انطلق...</p>
    </div>
  </main>

  <!-- Protocol Check Fallback -->
  <script>
    if (window.location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        const vp = document.getElementById('app-viewport');
        if (vp) {
          vp.innerHTML = `
            <div style="max-width:540px; margin:80px auto; padding:36px; text-align:center; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:20px; color:#ef4444;" class="glass-card">
              <h2 style="font-size:1.4rem; font-weight:900; margin-bottom:12px;">⚠️ يرجى فتح الموقع عبر الرابط التالي:</h2>
              <p style="color:var(--text-main); font-size:0.92rem; line-height:1.6; margin-bottom:20px;">
                لقد قمت بفتح الملف مباشرة من المجلد (file://) والمتصفح يمنع تشغيل السكريبتات برمجياً. يرجى كتابة هذا العنوان في المتصفح:
              </p>
              <a href="http://localhost:3000" style="display:inline-block; background:#0056D2; color:#fff; padding:12px 28px; border-radius:30px; font-weight:800; text-decoration:none;">http://localhost:3000 🌐</a>
            </div>
          `;
        }
      });
    }
  </script>

  <!-- Global Toast Notification -->
  <div id="toast-container" class="toast-container"></div>

  <!-- SPA Router Script -->
  <script type="module" src="app.js"></script>

  <!-- Floating WhatsApp Icon -->
  <a href="https://wa.me/1234567890" target="_blank" class="floating-whatsapp"
    title="تواصل معنا عبر واتساب / Contact us on WhatsApp">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" style="width:28px;height:28px;fill:#fff;">
      <path
        d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z" />
    </svg>
  </a>
  <style>
    .floating-whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 55px;
      height: 55px;
      background-color: #25D366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      z-index: 1000;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .floating-whatsapp:hover {
      transform: scale(1.1) translateY(-5px);
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
    }

    :lang(ar) .floating-whatsapp,
    [dir="rtl"] .floating-whatsapp {
      right: auto;
      left: 20px;
    }
  </style>
</body>

</html>
